services:
  keroagile:
    build: .
    image: keroagile:latest
    # Default command is 'mcp' (stdio — not useful in compose).
    # Override for CLI or API usage:
    #   docker compose run keroagile task list
    #   docker compose run keroagile serve
    command: ["mcp"]
    environment:
      KEROAGILE_DATA_DIR: /data
    volumes:
      - keroagile-data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Optional: browser-accessible TUI via ttyd (port 7433)
  # docker compose --profile browser up
  #
  # Anyone who can open this port can read and edit the whole board, so by
  # default it is published on this machine only. Settings (environment or
  # a .env file next to this one):
  #
  #   KEROAGILE_TTYD_BIND=0.0.0.0             publish on every interface
  #   KEROAGILE_TTYD_CREDENTIAL=user:password require a login in the browser
  #   KEROAGILE_TTYD_PORT=7433                host port
  #   KEROAGILE_TTYD_MAX_CLIENTS=2            limit simultaneous sessions
  #
  # If you publish it beyond this machine, set a credential unless your
  # network already restricts who can reach it.
  keroagile-browser:
    build:
      context: .
      dockerfile: Dockerfile.ttyd
    image: keroagile-ttyd:latest
    profiles: ["browser"]
    environment:
      KEROAGILE_DATA_DIR: /data
      TTYD_CREDENTIAL: ${KEROAGILE_TTYD_CREDENTIAL:-}
      TTYD_MAX_CLIENTS: ${KEROAGILE_TTYD_MAX_CLIENTS:-}
    volumes:
      - keroagile-data:/data
    ports:
      - "${KEROAGILE_TTYD_BIND:-127.0.0.1}:${KEROAGILE_TTYD_PORT:-7433}:7433"
    restart: unless-stopped

volumes:
  keroagile-data:
